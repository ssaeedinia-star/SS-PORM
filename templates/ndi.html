<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SS-PORM | NDI</title><style>body{font-family:Tahoma,Arial,sans-serif;max-width:850px;margin:auto;padding:16px;background:#f5f5f5}.card{background:#fff;padding:16px;margin:12px 0;border-radius:14px}.item{border-top:1px solid #ddd;padding-top:12px;margin-top:12px}label{display:block;padding:7px;border-radius:8px}input{width:auto}.out{background:#eef6ff;padding:14px;border-radius:10px;font-size:18px;font-weight:bold;position:sticky;top:5px}button{padding:12px 16px;border:0;border-radius:10px;font-size:16px;background:#1769aa;color:white}.small{font-size:13px;color:#555}</style></head><body><div class="card"><h1>Neck Disability Index (NDI) — نسخه فارسی SS-PORM</h1><p class="small">ترجمه فارسی بر اساس فرم انگلیسی ارسالی. برای هر بخش فقط یک گزینه را انتخاب کنید. هر بخش ۰ تا ۵ امتیاز دارد؛ امتیاز خام از ۵۰ و درصد ناتوانی از ۰ تا ۱۰۰ به‌صورت خودکار محاسبه می‌شود.</p><div class="out">NDI: <span id="raw">—</span> / 50 &nbsp; | &nbsp; <span id="pct">—</span>%</div><div id="questions"></div><button type="button" onclick="saveAndReturn()">ذخیره امتیاز و بازگشت به فرم</button></div><script>
const sections=[
['شدت درد گردن',['در حال حاضر درد گردن ندارم.','در حال حاضر درد بسیار خفیف است.','در حال حاضر درد متوسط است.','در حال حاضر درد نسبتاً شدید است.','در حال حاضر درد بسیار شدید است.','در حال حاضر درد در بدترین حد قابل تصور است.']],
['مراقبت شخصی',['می‌توانم به‌طور طبیعی از خودم مراقبت کنم، بدون اینکه درد گردنم بیشتر شود.','می‌توانم به‌طور طبیعی از خودم مراقبت کنم، اما این کار درد گردنم را بیشتر می‌کند.','مراقبت از خود دردناک است و کارها را آهسته و با احتیاط انجام می‌دهم.','به مقداری کمک نیاز دارم، اما بیشتر مراقبت‌های شخصی را خودم انجام می‌دهم.','برای بیشتر جنبه‌های مراقبت از خود، هر روز به کمک نیاز دارم.','لباس نمی‌پوشم؛ به‌سختی خودم را می‌شویم و در تخت می‌مانم.']],
['بلند کردن اجسام',['می‌توانم اجسام سنگین را بدون افزایش درد گردن بلند کنم.','می‌توانم اجسام سنگین را بلند کنم، اما درد گردنم بیشتر می‌شود.','درد گردن مانع بلند کردن اجسام سنگین از روی زمین می‌شود، ولی اگر جسم در جای مناسبی مثل روی میز باشد می‌توانم آن را بلند کنم.','درد گردن مانع بلند کردن اجسام سنگین می‌شود، ولی اگر اجسام سبک در جای مناسبی باشند می‌توانم آن‌ها را بلند کنم.','فقط می‌توانم اجسام بسیار سبک را بلند کنم.','اصلاً نمی‌توانم چیزی را بلند یا حمل کنم.']],
['مطالعه',['می‌توانم هرقدر بخواهم بدون درد گردن مطالعه کنم.','می‌توانم هرقدر بخواهم با درد خفیف گردن مطالعه کنم.','می‌توانم هرقدر بخواهم با درد متوسط گردن مطالعه کنم.','به علت درد متوسط گردن نمی‌توانم به اندازه‌ای که می‌خواهم مطالعه کنم.','به علت درد شدید گردن نمی‌توانم به اندازه‌ای که می‌خواهم مطالعه کنم.','اصلاً نمی‌توانم مطالعه کنم.']],
['سردرد',['اصلاً سردرد ندارم.','سردردهای خفیف دارم که به‌ندرت رخ می‌دهند.','سردردهای متوسط دارم که به‌ندرت رخ می‌دهند.','سردردهای متوسط دارم که مکرراً رخ می‌دهند.','سردردهای شدید دارم که مکرراً رخ می‌دهند.','تقریباً همیشه سردرد دارم.']],
['تمرکز',['می‌توانم بدون هیچ مشکلی کاملاً تمرکز کنم.','می‌توانم کاملاً تمرکز کنم، ولی کمی دشواری دارم.','در تمرکز کردن تا حد قابل توجهی مشکل دارم.','در تمرکز کردن مشکل زیادی دارم.','در تمرکز کردن مشکل بسیار زیادی دارم.','اصلاً نمی‌توانم تمرکز کنم.']],
['کار',['می‌توانم هر مقدار کاری که می‌خواهم انجام دهم.','فقط می‌توانم کار معمول خود را انجام دهم و بیشتر از آن نمی‌توانم.','می‌توانم بیشتر کارهای معمول خود را انجام دهم، اما نه همه آن‌ها را.','نمی‌توانم کار معمول خود را انجام دهم.','تقریباً هیچ کاری نمی‌توانم انجام دهم.','اصلاً نمی‌توانم هیچ کاری انجام دهم.']],
['رانندگی',['می‌توانم بدون درد گردن رانندگی کنم.','می‌توانم فقط با درد خفیف گردن رانندگی کنم.','می‌توانم هرقدر بخواهم با درد متوسط گردن رانندگی کنم.','به علت درد متوسط گردن نمی‌توانم هرقدر که می‌خواهم رانندگی کنم.','به علت درد شدید گردن تقریباً نمی‌توانم رانندگی کنم.','به علت درد گردن اصلاً نمی‌توانم رانندگی کنم.']],
['خواب',['هیچ مشکلی در خواب ندارم.','خوابم کمی مختل است؛ کمتر از ۱ ساعت.','خوابم به میزان خفیف مختل است؛ حدود ۱ تا ۲ ساعت.','خوابم به میزان متوسط مختل است؛ حدود ۲ تا ۳ ساعت.','خوابم به‌شدت مختل است؛ حدود ۳ تا ۵ ساعت.','خوابم تقریباً کاملاً مختل است؛ حدود ۵ تا ۷ ساعت.']],
['فعالیت‌های تفریحی',['می‌توانم همه فعالیت‌های تفریحی خود را بدون هیچ درد گردنی انجام دهم.','می‌توانم همه فعالیت‌های تفریحی خود را با مقداری درد گردن انجام دهم.','به علت درد گردن می‌توانم بیشتر، ولی نه همه، فعالیت‌های تفریحی خود را انجام دهم.','به علت درد گردن فقط می‌توانم تعداد کمی از فعالیت‌های تفریحی خود را انجام دهم.','به علت درد گردن تقریباً نمی‌توانم فعالیت تفریحی انجام دهم.','به علت درد گردن اصلاً نمی‌توانم هیچ فعالیت تفریحی انجام دهم.']]
];
const q=document.getElementById('questions');sections.forEach((s,i)=>{let h=`<div class="item"><h3>${i+1}. ${s[0]}</h3>`;s[1].forEach((t,v)=>h+=`<label><input type="radio" name="q${i+1}" value="${v}"> <b>${v}</b> — ${t}</label>`);q.insertAdjacentHTML('beforeend',h+'</div>')});
function calc(){let sum=0,n=0;sections.forEach((_,i)=>{const x=document.querySelector(`input[name=q${i+1}]:checked`);if(x){sum+=+x.value;n++}});const pct=n?Math.round(sum/(n*5)*100):null;document.getElementById('raw').textContent=n===10?sum:'—';document.getElementById('pct').textContent=pct===null?'—':pct;return {raw:n===10?sum:null,pct,n}}document.addEventListener('change',calc);
const p=new URLSearchParams(location.search),key=p.get('key')||'ndi_score';try{const saved=JSON.parse(localStorage.getItem('ssporm_ndi_'+key)||'{}');Object.entries(saved.answers||{}).forEach(([n,v])=>{const e=document.querySelector(`input[name="${n}"][value="${v}"]`);if(e)e.checked=true});calc()}catch(e){}
function saveAndReturn(){const answers={};sections.forEach((_,i)=>{const x=document.querySelector(`input[name=q${i+1}]:checked`);if(x)answers['q'+(i+1)]=x.value});const s=calc();if(s.n<10&&!confirm('همه ۱۰ بخش تکمیل نشده‌اند. با امتیاز تعدیل‌شده ذخیره شود؟'))return;localStorage.setItem('ssporm_ndi_'+key,JSON.stringify({answers,raw:s.raw,score:s.pct}));if(window.opener){window.opener.postMessage({type:'ssporm-ndi',key,score:s.pct,raw:s.raw},location.origin);window.close()}else history.back()}
</script></body></html>
