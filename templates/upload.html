<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SS-PORM | افزودن فایل بیمار</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css"><style>body{font-family:Tahoma,Arial,sans-serif;max-width:650px;margin:20px auto;padding:16px;background:#f4f6f8;color:#222}.card{background:#fff;padding:22px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}label{display:block;font-weight:600;margin-top:8px}input,select,button{width:100%;padding:12px;margin:7px 0 15px;box-sizing:border-box;border:1px solid #ccd2d8;border-radius:8px;font-size:15px}button{background:#1769aa;color:#fff;border:none;font-weight:700}.secondary{display:block;text-align:center;text-decoration:none;background:#555;color:#fff;padding:11px;border-radius:8px;margin-top:8px}#status{text-align:center;font-weight:700}.hint{font-size:12px;color:#666;margin-top:-8px;margin-bottom:12px}</style><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script><script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script></head><body><div class="card"><h2>SS-PORM</h2><p>افزودن تصویر یا مدرک به پرونده بیمار</p><form id="uploadForm"><label>کد بیمار</label><input type="text" id="patientCode" value="{{ patient_code or '' }}" required><label>عنوان فایل</label><input type="text" id="title" placeholder="مثال: X-ray AP قبل از عمل" required><label>تاریخ فایل (شمسی)</label><input type="text" id="date" placeholder="برای انتخاب تاریخ لمس کنید" readonly><label>نوع فایل</label><select id="type"><option value="X-ray">X-ray</option><option value="CT">CT Scan</option><option value="MRI">MRI</option><option value="Clinical Photo">Clinical Photo</option><option value="Document">Document</option><option value="Other">Other</option></select><label>مرحله / زمان فایل</label><select id="stage" required><option value="">انتخاب کنید</option><option value="Pre-op">Pre-op</option><option value="Post-op">Post-op</option><option value="Follow-up 6 weeks">Follow-up 6 weeks</option><option value="Follow-up 3 months">Follow-up 3 months</option><option value="Follow-up 6 months">Follow-up 6 months</option><option value="Follow-up 1 year">Follow-up 1 year</option><option value="Other">Other</option></select><label>انتخاب فایل</label><input type="file" id="file" accept="image/*,.pdf,.doc,.docx" required><button type="submit" id="saveFile">ذخیره فایل</button><div class="hint">پس از ذخیره، فرم فایل خالی می‌شود و کد بیمار باقی می‌ماند تا فایل بعدی را ثبت کنید.</div></form><p id="status"></p><a id="backToPatient" class="secondary" href="/">پایان و مشاهده پرونده بیمار</a></div><script>const patientInput=document.getElementById('patientCode');function updateBackLink(){const c=patientInput.value.trim();document.getElementById('backToPatient').href=c?'/patient/'+encodeURIComponent(c):'/';}patientInput.addEventListener('input',updateBackLink);updateBackLink();document.getElementById('uploadForm').addEventListener('submit',async function(e){e.preventDefault();const patientCode=patientInput.value.trim(),file=document.getElementById('file').files[0],status=document.getElementById('status'),btn=document.getElementById('saveFile');if(!patientCode||!file){status.innerText='❌ کد بیمار و فایل الزامی است';return}const fd=new FormData();fd.append('file',file);fd.append('title',document.getElementById('title').value.trim());fd.append('date',document.getElementById('date').value);fd.append('type',document.getElementById('type').value);fd.append('stage',document.getElementById('stage').value);btn.disabled=true;status.innerText='در حال ذخیره...';try{const r=await fetch('/api/upload/'+encodeURIComponent(patientCode),{method:'POST',body:fd}),x=await r.json();if(r.ok){status.innerText='✅ فایل ذخیره شد؛ فایل بعدی را انتخاب کنید';document.getElementById('title').value='';document.getElementById('date').value='';document.getElementById('stage').value='';document.getElementById('file').value='';document.getElementById('title').focus();}else status.innerText='❌ '+(x.error||'ذخیره ناموفق بود')}catch(err){status.innerText='❌ خطا در ارتباط با سرور'}finally{btn.disabled=false}});$(document).ready(function(){$('#date').persianDatepicker({format:'YYYY/MM/DD',autoClose:true,initialValue:false,observer:true,calendar:{persian:{locale:'fa'}}});});</script></body></html>
