<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SS-PORM | mJOA</title><style>body{font-family:Tahoma,Arial,sans-serif;max-width:850px;margin:auto;padding:16px;background:#f5f5f5}.card{background:#fff;padding:16px;margin:12px 0;border-radius:14px}.item{border-top:1px solid #ddd;padding-top:12px;margin-top:12px}label{display:block;padding:8px;border-radius:8px;line-height:1.7}input{width:auto}.out{background:#eef6ff;padding:14px;border-radius:10px;font-size:18px;font-weight:bold;position:sticky;top:5px}button{padding:12px 16px;border:0;border-radius:10px;font-size:16px;background:#1769aa;color:white}.small{font-size:13px;color:#555}</style></head><body><div class="card"><h1>Modified Japanese Orthopaedic Association (mJOA)</h1><p class="small">برای هر یک از چهار بخش یک گزینه انتخاب کنید. مجموع امتیاز ۰ تا ۱۸ است؛ امتیاز کمتر نشان‌دهنده شدت بیشتر میلوپاتی است.</p><div class="out">امتیاز نهایی mJOA: <span id="score">—</span> / 18<br><span id="severity"></span></div><div id="questions"></div><button type="button" onclick="saveAndReturn()">ذخیره امتیاز و بازگشت به فرم</button></div><script>
const sections=[
['I. عملکرد حرکتی اندام فوقانی',[[0,'اصلاً قادر به حرکت دادن دست‌ها نیستم.'],[1,'می‌توانم دست‌هایم را کمی حرکت دهم، اما قادر نیستم خودم غذا بخورم.'],[2,'می‌توانم خودم غذا بخورم، اما قادر به بستن دکمه‌های پیراهنم نیستم.'],[3,'می‌توانم دکمه‌های پیراهنم را ببندم، اما این کار بسیار دشوار است و زمان زیادی می‌برد.'],[4,'می‌توانم دکمه‌های پیراهنم را با کمی دشواری ببندم.'],[5,'دست‌هایم به‌طور طبیعی کار می‌کنند.']]],
['II. عملکرد حرکتی اندام تحتانی',[[0,'پاهایم فلج هستند و قادر به حرکت دادن یا حس کردن آن‌ها نیستم.'],[1,'پاهایم را حس می‌کنم، اما اصلاً قادر به حرکت دادن آن‌ها نیستم.'],[2,'می‌توانم پاهایم را حرکت دهم، اما قادر به راه رفتن نیستم.'],[3,'می‌توانم راه بروم، اما به وسیله کمکی برای راه رفتن نیاز دارم.'],[4,'می‌توانم از پله‌ها بالا و پایین بروم، اما باید نرده را بگیرم.'],[5,'در پاهایم کمی بی‌ثباتی دارم، اما می‌توانم بدون گرفتن نرده از پله‌ها بالا و پایین بروم.'],[6,'کمی بی‌ثبات هستم، اما می‌توانم بدون کمک راه بروم.'],[7,'پاهایم هیچ مشکلی ندارند.']]],
['III. حس اندام فوقانی',[[0,'قادر به حس کردن دست‌هایم نیستم.'],[1,'در دست‌هایم درد یا کاهش شدید حس، از جمله بی‌حسی و گزگز، دارم.'],[2,'در دست‌هایم کاهش خفیف حس، از جمله بی‌حسی و گزگز، دارم.'],[3,'هیچ کاهش حسی در دست‌هایم ندارم.']]],
['IV. عملکرد اسفنکتر / ادرار',[[0,'هنگام دفع ادرار قادر به کنترل آن نیستم.'],[1,'در دفع ادرار مشکل قابل‌توجهی دارم.'],[2,'در دفع ادرار مشکل خفیفی دارم.'],[3,'در دفع ادرار هیچ مشکلی ندارم.']]]
];
const q=document.getElementById('questions');sections.forEach((s,i)=>{let h=`<div class="item"><h3>${s[0]}</h3>`;s[1].forEach(([v,t])=>h+=`<label><input type="radio" name="q${i+1}" value="${v}"> <b>${v}</b> — ${t}</label>`);q.insertAdjacentHTML('beforeend',h+'</div>')});
function calc(){let sum=0,n=0;sections.forEach((_,i)=>{const x=document.querySelector(`input[name=q${i+1}]:checked`);if(x){sum+=+x.value;n++}});const complete=n===4;document.getElementById('score').textContent=complete?sum:'—';let sev='';if(complete)sev=sum<=11?'میلوپاتی شدید':sum<=14?'میلوپاتی متوسط':sum<=17?'میلوپاتی خفیف':'امتیاز ۱۸';document.getElementById('severity').textContent=sev;return complete?sum:null}document.addEventListener('change',calc);
const p=new URLSearchParams(location.search),key=p.get('key')||'mjoa_score';try{const saved=JSON.parse(localStorage.getItem('ssporm_mjoa_'+key)||'{}');Object.entries(saved.answers||{}).forEach(([n,v])=>{const e=document.querySelector(`input[name="${n}"][value="${v}"]`);if(e)e.checked=true});calc()}catch(e){}
function saveAndReturn(){const answers={};sections.forEach((_,i)=>{const x=document.querySelector(`input[name=q${i+1}]:checked`);if(x)answers['q'+(i+1)]=x.value});const score=calc();if(score===null){alert('لطفاً هر چهار بخش را تکمیل کنید.');return}localStorage.setItem('ssporm_mjoa_'+key,JSON.stringify({answers,score}));if(window.opener){window.opener.postMessage({type:'ssporm-mjoa',key,score},location.origin);window.close()}else history.back()}
</script></body></html>
