<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SS-PORM | MODQ</title><style>body{font-family:Tahoma,Arial,sans-serif;max-width:850px;margin:auto;padding:16px;background:#f5f5f5}.card{background:#fff;padding:16px;margin:12px 0;border-radius:14px}.item{border-top:1px solid #ddd;padding-top:12px;margin-top:12px}label{display:block;padding:7px;border-radius:8px}input{width:auto}.out{background:#eef6ff;padding:14px;border-radius:10px;font-size:18px;font-weight:bold;position:sticky;top:5px}button{padding:12px 16px;border:0;border-radius:10px;font-size:16px;background:#1769aa;color:white}.small{font-size:13px;color:#555}</style></head><body><div class="card"><h1>Persian Modified Oswestry Disability Questionnaire (MODQ)</h1><p class="small">برای هر بخش فقط یک گزینه را انتخاب کنید. امتیاز هر بخش از ۰ تا ۵ است و امتیاز نهایی به مقیاس ۰ تا ۱۰۰ محاسبه می‌شود.</p><div class="out">امتیاز نهایی MODQ: <span id="score">—</span></div><div id="questions"></div><button type="button" onclick="saveAndReturn()">ذخیره امتیاز و بازگشت به فرم</button></div><script>
const sections=[
['شدت درد',['در حال حاضر هیچ دردی ندارم.','در حال حاضر درد بسیار خفیف است.','در حال حاضر درد متوسط است.','در حال حاضر درد نسبتاً شدید است.','در حال حاضر درد بسیار شدید است.','در حال حاضر درد بدترین حالت قابل تصور است.']],
['مراقبت شخصی',['بدون درد اضافی می‌توانم از خودم مراقبت کنم.','می‌توانم از خودم مراقبت کنم ولی باعث درد اضافی می‌شود.','مراقبت از خود دردناک است و آهسته و با احتیاط انجام می‌دهم.','به کمی کمک نیاز دارم ولی بیشتر کارهای شخصی را خودم انجام می‌دهم.','برای بیشتر جنبه‌های مراقبت شخصی هر روز به کمک نیاز دارم.','نمی‌توانم لباس بپوشم؛ به سختی شست‌وشو می‌کنم و در بستر می‌مانم.']],
['بلند کردن اجسام',['می‌توانم اجسام سنگین را بدون درد اضافی بلند کنم.','می‌توانم اجسام سنگین را بلند کنم ولی باعث درد اضافی می‌شود.','درد مانع بلند کردن اجسام سنگین از روی زمین است، ولی اگر در جای مناسب باشند می‌توانم.','درد مانع اجسام سنگین است، ولی اجسام سبک تا متوسط را اگر مناسب باشند می‌توانم.','فقط اجسام بسیار سبک را می‌توانم بلند کنم.','اصلاً نمی‌توانم چیزی را بلند یا حمل کنم.']],
['راه رفتن',['درد مانع راه رفتن در هیچ مسافتی نمی‌شود.','درد مانع راه رفتن بیش از حدود ۱٫۵ کیلومتر می‌شود.','درد مانع راه رفتن بیش از حدود ۵۰۰ متر می‌شود.','درد مانع راه رفتن بیش از حدود ۱۰۰ متر می‌شود.','فقط با عصا یا عصای زیر بغل می‌توانم راه بروم.','بیشتر اوقات در بستر هستم و برای رفتن به توالت باید سینه‌خیز بروم.']],
['نشستن',['می‌توانم روی هر صندلی هرقدر بخواهم بنشینم.','فقط روی صندلی مورد علاقه‌ام هرقدر بخواهم می‌نشینم.','درد مانع نشستن بیش از یک ساعت می‌شود.','درد مانع نشستن بیش از نیم ساعت می‌شود.','درد مانع نشستن بیش از ده دقیقه می‌شود.','درد اصلاً اجازه نشستن نمی‌دهد.']],
['ایستادن',['می‌توانم هرقدر بخواهم بدون درد اضافی بایستم.','می‌توانم هرقدر بخواهم بایستم ولی باعث درد اضافی می‌شود.','درد مانع ایستادن بیش از یک ساعت می‌شود.','درد مانع ایستادن بیش از نیم ساعت می‌شود.','درد مانع ایستادن بیش از ده دقیقه می‌شود.','درد اصلاً اجازه ایستادن نمی‌دهد.']],
['خوابیدن',['خواب من هرگز به علت درد مختل نمی‌شود.','گاهی خوابم به علت درد مختل می‌شود.','به علت درد کمتر از ۶ ساعت می‌خوابم.','به علت درد کمتر از ۴ ساعت می‌خوابم.','به علت درد کمتر از ۲ ساعت می‌خوابم.','درد کاملاً مانع خواب می‌شود.']],
['زندگی جنسی',['زندگی جنسی طبیعی است و درد اضافی ایجاد نمی‌کند.','زندگی جنسی طبیعی است ولی درد اضافی ایجاد می‌کند.','زندگی جنسی تقریباً طبیعی است ولی بسیار دردناک است.','زندگی جنسی به‌شدت به علت درد محدود شده است.','زندگی جنسی تقریباً به علت درد وجود ندارد.','درد مانع هرگونه زندگی جنسی می‌شود.']],
['زندگی اجتماعی',['زندگی اجتماعی طبیعی است و درد اضافی ایجاد نمی‌کند.','زندگی اجتماعی طبیعی است ولی شدت درد را افزایش می‌دهد.','درد اثر مهمی بر زندگی اجتماعی ندارد جز محدود کردن فعالیت‌های پرتحرک.','درد زندگی اجتماعی را محدود کرده و کمتر بیرون می‌روم.','درد زندگی اجتماعی را به خانه محدود کرده است.','به علت درد هیچ زندگی اجتماعی ندارم.']],
['مسافرت',['بدون درد اضافی می‌توانم به هر جا سفر کنم.','می‌توانم به هر جا سفر کنم ولی درد اضافی ایجاد می‌شود.','درد شدید است ولی سفر بیش از دو ساعت را تحمل می‌کنم.','درد سفر را به کمتر از یک ساعت محدود می‌کند.','درد سفرهای ضروری کوتاه کمتر از ۳۰ دقیقه را ممکن می‌کند.','درد جز برای درمان اجازه سفر نمی‌دهد.']]
];
const q=document.getElementById('questions');sections.forEach((s,i)=>{let h=`<div class="item"><h3>${i+1}. ${s[0]}</h3>`;s[1].forEach((t,v)=>h+=`<label><input type="radio" name="q${i+1}" value="${v}"> <b>${v}</b> — ${t}</label>`);q.insertAdjacentHTML('beforeend',h+'</div>')});
function calc(){let sum=0,n=0;sections.forEach((_,i)=>{const x=document.querySelector(`input[name=q${i+1}]:checked`);if(x){sum+=+x.value;n++}});const score=n?Math.round(sum/(n*5)*100):null;document.getElementById('score').textContent=score===null?'—':score;return score}document.addEventListener('change',calc);
const p=new URLSearchParams(location.search),key=p.get('key')||'modq_score';try{const saved=JSON.parse(localStorage.getItem('ssporm_modq_'+key)||'{}');Object.entries(saved.answers||{}).forEach(([n,v])=>{const e=document.querySelector(`input[name="${n}"][value="${v}"]`);if(e)e.checked=true});calc()}catch(e){}
function saveAndReturn(){const answers={};sections.forEach((_,i)=>{const x=document.querySelector(`input[name=q${i+1}]:checked`);if(x)answers['q'+(i+1)]=x.value});const score=calc();localStorage.setItem('ssporm_modq_'+key,JSON.stringify({answers,score}));if(window.opener){window.opener.postMessage({type:'ssporm-modq',key,score},location.origin);window.close()}else history.back()}
</script></body></html>
