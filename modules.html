<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SS-PORM | Module</title><style>body{font-family:Tahoma,Arial,sans-serif;max-width:850px;margin:auto;padding:16px;background:#f5f5f5}.card,details{background:#fff;padding:16px;margin:12px 0;border-radius:14px}summary{font-weight:700;font-size:18px;cursor:pointer}label{display:block;margin:10px 0 5px}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #bbb;border-radius:9px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:12px 16px;border:0;border-radius:10px;font-size:16px;margin:4px}.primary{background:#1769aa;color:#fff}.small{font-size:13px;color:#555}@media(max-width:520px){.row{grid-template-columns:1fr}}</style></head><body><h1 id="title">SS-PORM</h1><div class="card"><label>کد بیمار / کد مطالعه</label><input id="code"><button onclick="loadP()">بازیابی</button><button onclick="location.href='/'">فرم اصلی</button><div id="status" class="small"></div></div><form id="mf"><div id="content"></div><div class="card"><button type="button" class="primary" onclick="saveP()">ذخیره ماژول</button><div id="saveStatus" class="small"></div></div></form><script>
const p=new URLSearchParams(location.search),type=p.get('type')||'thoracolumbar';document.getElementById('code').value=p.get('patient_code')||'';
const configs={
thoracolumbar:{title:'📁 ماژول Thoracolumbar / Lumbar',html:`<details open><summary>ارزیابی اختصاصی Thoracolumbar / Lumbar</summary><div class="row"><div><label>NRS کمردرد 0–10</label><input type="number" min="0" max="10" name="nrs_back"></div><div><label>NRS درد اندام 0–10</label><input type="number" min="0" max="10" name="nrs_leg"></div></div><label>سطح/سطوح اصلی درگیر</label><input name="imaging_levels"><label>شرح deficit نورولوژیک</label><textarea name="neurologic_summary"></textarea></details><details><summary>ODI / MODQ</summary><p>امتیاز ODI/MODQ و پیگیری‌ها</p><div class="row">${scoreInputs('odi',100)}</div></details><details><summary>جراحی Thoracolumbar / Lumbar</summary>${commonSurgery()}<div class="row">${num('posterior_instrumentation_levels','Posterior instrumentation — تعداد سطوح')}${num('fusion_levels','Fusion — تعداد سطوح')}${num('plif_levels','PLIF')}${num('tlif_levels','TLIF')}${num('alif_levels','ALIF')}${num('olif_levels','OLIF')}${num('llif_levels','LLIF / XLIF')}${num('decompression_only_levels','Decompression-only')}${num('pso_levels','PSO')}${num('spo_levels','SPO')}${num('laminofacetectomy_levels','Laminofacetectomy')}${num('discectomy_levels','Discectomy')}${num('fenestration_levels','Fenestration')}</div><label>توضیحات تکنیک/سطوح</label><textarea name="procedure_detail"></textarea></details>`},
deformity:{title:'📁 ماژول Deformity',html:`<details open><summary>Deformity / Alignment</summary><div class="row">${num('cobb_angle','Cobb angle (°)')}${text('curve_apex','Curve apex')}${num('pi','PI')}${num('pt','PT')}${num('ll','LL')}${num('pill','PI–LL')}${num('sva','SVA (mm)')}${num('t1pa','T1PA')}</div><label>شرح Whole-spine / Alignment</label><textarea name="xray_description"></textarea></details><details><summary>جراحی Deformity</summary>${commonSurgery()}<div class="row">${num('posterior_instrumentation_levels','Posterior instrumentation')}${num('fusion_levels','Fusion levels')}${text('uiv','UIV')}${text('liv','LIV')}${num('pso_levels','PSO')}${num('spo_levels','SPO')}</div><label>Pelvic fixation</label><select name="pelvic"><option></option><option>خیر</option><option>بله</option></select><label>توضیحات</label><textarea name="procedure_detail"></textarea></details>`},
asd:{title:'📁 ماژول ASD / Revision',html:`<details open><summary>Adjacent Segment Disease / Revision</summary><label>تعداد جراحی‌های قبلی</label><input type="number" name="prior_spine_surgery_count"><label>ناحیه و سطوح جراحی قبلی</label><input name="prior_surgery_levels"><label>شرح جراحی‌های قبلی</label><textarea name="prior_surgery_description"></textarea><label>علت Revision</label><select name="revision_indication"><option></option><option>Adjacent segment disease</option><option>Pseudarthrosis / nonunion</option><option>Implant loosening / breakage</option><option>Recurrent/residual stenosis</option><option>Progressive deformity / sagittal imbalance</option><option>PJK / PJF</option><option>Infection</option><option>Neurologic deterioration</option><option>Persistent pain / failed back surgery</option><option>سایر / چند علت</option></select></details><details><summary>جراحی ASD / Revision</summary>${commonSurgery()}<label>شرح برنامه Revision</label><textarea name="procedure_detail"></textarea></details>`},
tumor:{title:'📁 ماژول Tumor',html:`<details open><summary>Spine Tumor</summary><label>ناحیه/سطح تومور</label><input name="tumor_level"><label>نوع/تشخیص پاتولوژیک</label><input name="tumor_pathology"><label>Primary / Metastatic</label><select name="tumor_origin"><option></option><option>Primary</option><option>Metastatic</option><option>Unknown</option></select><label>درگیری عصبی / Cord compression</label><textarea name="tumor_neural_involvement"></textarea><label>درمان انکولوژیک قبلی/برنامه‌ریزی‌شده</label><textarea name="tumor_oncology_treatment"></textarea></details><details><summary>جراحی Tumor</summary>${commonSurgery()}<label>هدف جراحی</label><select name="tumor_surgery_goal"><option></option><option>Biopsy</option><option>Decompression</option><option>Resection</option><option>Stabilization</option><option>Combined</option></select><label>شرح عمل</label><textarea name="procedure_detail"></textarea></details>`},
trauma:{title:'📁 ماژول Trauma',html:`<details open><summary>Spine Trauma</summary><label>سطح آسیب</label><input name="trauma_level"><label>نوع شکستگی/آسیب</label><input name="trauma_pattern"><label>Neurologic status / deficit</label><textarea name="trauma_neurologic_status"></textarea><label>Associated injuries</label><textarea name="trauma_associated_injuries"></textarea></details><details><summary>جراحی Trauma</summary>${commonSurgery()}<label>Stabilization / Decompression details</label><textarea name="procedure_detail"></textarea></details>`}}
function num(n,l){return `<div><label>${l}</label><input type="number" name="${n}"></div>`}function text(n,l){return `<div><label>${l}</label><input name="${n}"></div>`}function commonSurgery(){return `<label>نوع/شرح کلی عمل</label><input name="procedure"><div class="row">${num('levels','تعداد کل سطوح جراحی')}<div><label>Revision</label><select name="revision"><option>خیر</option><option>بله</option></select></div></div>`}function scoreInputs(prefix,max){return ['baseline','3m','6m','12m','24m'].map(x=>`<div><label>${x}</label><input type="number" min="0" max="${max}" name="${prefix}_${x==='baseline'?'baseline':x}"></div>`).join('')}
const cfg=configs[type]||configs.thoracolumbar;document.getElementById('title').textContent=cfg.title;document.getElementById('content').innerHTML=cfg.html;
async function loadP(){let c=code.value.trim(),s=status;if(!c){s.textContent='کد بیمار را وارد کنید.';return}let r=await fetch('/api/patients/'+encodeURIComponent(c));if(!r.ok){s.textContent='پرونده پیدا نشد.';return}let d=await r.json();for(let e of mf.elements)if(e.name&&d[e.name]!==undefined)e.value=d[e.name];s.textContent='✓ اطلاعات بازیابی شد.'}async function saveP(){let c=code.value.trim();if(!c){saveStatus.textContent='کد بیمار را وارد کنید.';return}let r=await fetch('/api/patients/'+encodeURIComponent(c));if(!r.ok){saveStatus.textContent='ابتدا بیمار را در فرم اصلی ذخیره کنید.';return}let d=await r.json();for(let e of mf.elements)if(e.name)d[e.name]=e.value;d[type+'_module_completed']=true;d.patient_code=c;let w=await fetch('/api/patients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});saveStatus.textContent=w.ok?'✓ ذخیره شد.':'ذخیره انجام نشد.'}if(code.value)loadP();
</script></body></html>
