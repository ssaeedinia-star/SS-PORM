<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SS-PORM | Module</title><style>body{font-family:Tahoma,Arial,sans-serif;max-width:900px;margin:auto;padding:16px;background:#f5f5f5}.card,details{background:#fff;padding:16px;margin:12px 0;border-radius:14px}summary{font-weight:700;font-size:18px;cursor:pointer}label{display:block;margin:10px 0 5px}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #bbb;border-radius:9px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:12px 16px;border:0;border-radius:10px;font-size:16px;margin:4px}.primary,.qbtn{background:#1769aa;color:#fff}.small{font-size:13px;color:#555}.out{background:#eef6ff;padding:9px;border-radius:8px;margin-top:6px}.warn{background:#fff8e1;border:1px solid #ead08a;padding:10px;border-radius:9px}@media(max-width:520px){.row{grid-template-columns:1fr}}</style></head><body><h1 id="title">SS-PORM</h1><div class="card"><label>کد بیمار / کد مطالعه</label><input id="code"><button onclick="loadP()">بازیابی</button><button onclick="location.href='/'">فرم اصلی</button><div id="status" class="small"></div></div><form id="mf"><div id="content"></div><div class="card"><button type="button" class="primary" onclick="saveP()">ذخیره ماژول</button><div id="saveStatus" class="small"></div></div></form><script>
const p=new URLSearchParams(location.search),type=p.get('type')||'thoracolumbar';code.value=p.get('patient_code')||'';
const num=(n,l,min='',max='')=>`<div><label>${l}</label><input type="number" ${min!==''?'min="'+min+'"':''} ${max!==''?'max="'+max+'"':''} name="${n}"></div>`;
const text=(n,l)=>`<div><label>${l}</label><input name="${n}"></div>`;
const sel=(n,l,ops)=>`<div><label>${l}</label><select name="${n}"><option></option>${ops.map(x=>'<option>'+x+'</option>').join('')}</select></div>`;
const commonBase=(prefix='')=>`<details open><summary>اطلاعات پایه و ارزیابی Baseline</summary><div class="row">${text(prefix+'assessment_date','تاریخ ارزیابی (شمسی YYYY/MM/DD)')}${num(prefix+'nrs_back','NRS درد محوری / Back-Neck (0–10)',0,10)}${num(prefix+'nrs_limb','NRS درد اندام (0–10)',0,10)}${text(prefix+'symptom_duration_months','مدت علائم (ماه)')}</div><label>شرح وضعیت نورولوژیک / معاینه</label><textarea name="${prefix}neurologic_summary"></textarea></details>`;
const commonSurgery=(prefix='')=>`<details><summary>جراحی</summary><label>نوع/شرح کلی عمل</label><input name="${prefix}procedure"><div class="row">${num(prefix+'levels','تعداد کل سطوح جراحی',0)}${text(prefix+'surgery_date','تاریخ جراحی (شمسی YYYY/MM/DD)')}${text(prefix+'uiv','UIV')}${text(prefix+'liv','LIV')}${sel(prefix+'osteotomy_type','نوع Osteotomy',['None','SPO / Ponte','PSO','VCR','Other','Combined'])}${text(prefix+'osteotomy_levels','سطح/سطوح Osteotomy')}</div><label>جزئیات تکنیک، approach و سطوح</label><textarea name="${prefix}procedure_detail"></textarea></details>`;
const follow=(prefix='',prom=true)=>`<details><summary>پیگیری منظم</summary><div class="row">${num(prefix+'followup_interval_months','فاصله برنامه‌ریزی‌شده پیگیری (ماه)',1)}${text(prefix+'next_followup_date','تاریخ پیگیری بعدی (شمسی YYYY/MM/DD)')}</div><p class="small">Baseline در اطلاعات پایه ثبت می‌شود. پیگیری‌های 3، 6، 12 و 24 ماه در این قسمت ثبت شوند.</p>${['3m','6m','12m','24m'].map(t=>`<div class="card"><b>${t}</b><div class="row">${text(prefix+'date_'+t,'تاریخ شمسی')}${num(prefix+'nrs_'+t,'NRS (0–10)',0,10)}</div>${prom?`<button type="button" class="qbtn" onclick="openMODQ('${prefix}modq_${t}')">ODI/MODQ استاندارد</button><div class="out">امتیاز: <b id="score_${prefix}modq_${t}">—</b></div>`:''}</div>`).join('')}</details>`;
const configs={
thoracolumbar:{title:'📁 Thoracolumbar / Lumbar',html:commonBase('tl_')+`<details><summary>تشخیص اصلی و Imaging</summary><label>عنوان اصلی بیماری</label><select name="thoracolumbar_primary_diagnosis"><option></option><option>Spondylolisthesis</option><option>Lumbar / thoracolumbar stenosis</option><option>Disc herniation</option><option>Degenerative disc disease</option><option>Isthmic spondylolysis / spondylolisthesis</option><option>Adjacent segment disease</option><option>Pseudarthrosis / nonunion</option><option>Compression / burst fracture</option><option>Tumor</option><option>Infection / spondylodiscitis</option><option>Other</option></select><p class="small">Deformity و Revision در ماژول‌های مستقل ثبت می‌شوند.</p><label>سطح/سطوح اصلی درگیر</label><input name="imaging_levels"><label>MRI / CT description</label><textarea name="radiology_description"></textarea></details>`+commonSurgery('tl_')+follow('tl_')},
deformity:{title:'📁 Deformity',html:commonBase('def_')+`<details><summary>Deformity / Alignment</summary><div class="row">${num('def_cobb','Cobb angle (°)')}${text('def_curve_apex','Curve apex')}${num('def_pi','PI')}${num('def_pt','PT')}${num('def_ll','LL')}${num('def_pi_ll','PI–LL')}${num('def_sva','SVA (mm)')}${num('def_t1pa','T1PA')}</div><label>Whole-spine / Alignment description</label><textarea name="def_xray_description"></textarea></details>`+commonSurgery('def_')+follow('def_')},
asd:{title:'📁 REVISION',html:commonBase('rev_')+`<details><summary>Revision history</summary><div class="row">${num('rev_prior_count','تعداد جراحی‌های قبلی',0)}${text('rev_prior_levels','ناحیه و سطوح جراحی قبلی')}</div><label>شرح جراحی‌های قبلی</label><textarea name="rev_prior_description"></textarea><label>علت Revision</label><select name="rev_indication"><option></option><option>Adjacent segment disease</option><option>Pseudarthrosis / nonunion</option><option>Implant loosening / breakage</option><option>Recurrent/residual stenosis</option><option>Progressive deformity / sagittal imbalance</option><option>PJK / PJF</option><option>Infection</option><option>Neurologic deterioration</option><option>Persistent pain / failed back surgery</option><option>Other / mixed</option></select></details><details><summary>Alignment / Deformity assessment</summary><div class="row">${num('rev_cobb','Cobb angle (°)')}${num('rev_pi','PI (°)')}${num('rev_pt','PT (°)')}${num('rev_ll','LL (°)')}${num('rev_pi_ll','PI–LL mismatch (°)')}${num('rev_sva','SVA (mm)')}${num('rev_t1pa','T1PA (°)')}${num('rev_tk','Thoracic kyphosis (°)')}${num('rev_ss','Sacral slope (°)')}</div><label>Whole-spine alignment notes</label><textarea name="rev_alignment_notes"></textarea></details>`+commonSurgery('rev_')+follow('rev_')},
tumor:{title:'📁 Tumor',html:commonBase('tum_')+`<details><summary>Radiologic tumor description — Preoperative</summary><div class="row">${text('tum_level','سطح/سطوح ضایعه')}${sel('tum_compartment','Compartment',['Extradural / epidural','Intradural-extramedullary','Intramedullary','Osseous / vertebral','Paraspinal / foraminal','Mixed'])}${sel('tum_origin_preop','Clinical context',['Primary suspected','Metastatic suspected','Unknown'])}${sel('tum_cord_compression','Cord / cauda compression',['No','Mild','Moderate','Severe'])}</div><label>توصیف MRI / CT و extent ضایعه</label><textarea name="tum_radiology_description"></textarea></details>`+commonSurgery('tum_')+`<details><summary>اطلاعات پس از جراحی — Pathology & Oncology</summary><label>تشخیص پاتولوژی نهایی</label><input name="tum_final_pathology"><div class="row">${sel('tum_resection_extent','Extent of resection',['Biopsy only','Subtotal resection','Gross total resection','En bloc / wide resection','Not applicable'])}${text('tum_pathology_date','تاریخ گزارش پاتولوژی (شمسی)')}</div><label>درمان انکولوژیک / Adjuvant پس از جراحی</label><textarea name="tum_postop_adjuvant" placeholder="Radiotherapy, chemotherapy, targeted/systemic therapy, observation..."></textarea></details>`+follow('tum_')+`<details><summary>Tumor follow-up imaging</summary><p class="small">در صورت باقی‌ماندن تومور یا عود، اندازه ضایعه در هر پیگیری ثبت شود.</p><div class="row">${text('tum_size_3m','Residual/recurrence size — 3 ماه')}${text('tum_size_6m','Residual/recurrence size — 6 ماه')}${text('tum_size_12m','Residual/recurrence size — 12 ماه')}${text('tum_size_24m','Residual/recurrence size — 24 ماه')}</div></details>`},
trauma:{title:'📁 Trauma',html:commonBase('tr_')+`<details><summary>AO Spine Injury Classification</summary><div class="row">${text('tr_injury_level','سطح دقیق آسیب')}${sel('tr_region','ناحیه',['Upper cervical (OC–C2/3)','Subaxial cervical (C3–C7)','Thoracolumbar','Sacral'])}${sel('tr_morphology','Morphology / fracture type',['A0','A1','A2','A3','A4','B1','B2','B3','C','Upper cervical Type A','Upper cervical Type B','Upper cervical Type C','Sacral A','Sacral B','Sacral C'])}${sel('tr_neurology','Neurologic status',['N0','N1','N2','N3','N4','NX'])}${sel('tr_facet','Subaxial facet injury',['F1','F2','F3','F4','Bilateral / BL','Not applicable'])}${text('tr_modifiers','AO modifiers (مثال M1, M2, M3, M4)')}</div><label>شرح نوع شکستگی / dislocation و یافته‌های CT/MRI</label><textarea name="tr_fracture_description"></textarea><label>Associated injuries</label><textarea name="tr_associated_injuries"></textarea></details>`+commonSurgery('tr_')+follow('tr_',false)},
adolescent:{title:'📁 Adolescent Spinal Deformity',html:commonBase('ais_')+`<details open><summary>نوع Deformity و AIS / Lenke classification</summary><div class="row">${sel('ais_deformity_etiology','نوع / Etiology دفرمیتی',['Idiopathic','Congenital','Neuromuscular / Neurogenic','Syndromic','Early-onset / developmental','Post-traumatic','Post-infectious','Other'])}${text('ais_deformity_etiology_notes','شرح تکمیلی Etiology')}</div><p class="warn">Lenke = Curve type (1–6) + Lumbar modifier (A/B/C) + Thoracic sagittal modifier (−/N/+). برای تعیین structural curve از standing PA/AP، lateral و right/left bending استفاده شود.</p><div class="row">${sel('ais_lenke_type','Lenke curve type',['1 — Main Thoracic','2 — Double Thoracic','3 — Double Major','4 — Triple Major','5 — Thoracolumbar/Lumbar','6 — Thoracolumbar/Lumbar–Main Thoracic'])}${sel('ais_lumbar_modifier','Lumbar modifier',['A — CSVL between apical pedicles','B — CSVL touches apical vertebral body/pedicle','C — CSVL completely medial to apical body/pedicle'])}${sel('ais_sagittal_modifier','T5–T12 sagittal modifier',['−  (<10°)','N  (10–40°)','+  (>40°)'])}${text('ais_lenke_final','Lenke final (مثال 1AN یا 2C+)')}</div><h3>Curve measurements / structural criteria</h3><div class="row">${num('ais_pt_cobb','Proximal thoracic Cobb (°)')}${num('ais_pt_bending','PT bending residual (°)')}${num('ais_mt_cobb','Main thoracic Cobb (°)')}${num('ais_mt_bending','MT bending residual (°)')}${num('ais_tll_cobb','TL/L Cobb (°)')}${num('ais_tll_bending','TL/L bending residual (°)')}${num('ais_t2_t5_kyphosis','T2–T5 kyphosis (°)')}${num('ais_t10_l2_kyphosis','T10–L2 kyphosis (°)')}${num('ais_t5_t12_kyphosis','T5–T12 kyphosis (°)')}${text('ais_apex','Apex / apical vertebra')}</div><p class="small">Minor curve structural criterion: residual bending Cobb ≥25° یا regional kyphosis ≥20° در ناحیه مربوط.</p><div class="row">${text('ais_risser','Risser grade')}${sel('ais_triradiate','Triradiate cartilage',['Open','Closed','Not assessed'])}${text('ais_menarche','Menarchal status / maturity note')}${text('ais_rotation','Apical vertebral rotation')}</div><label>Clinical deformity / shoulder balance / rib prominence</label><textarea name="ais_clinical_description"></textarea></details>`+commonSurgery('ais_')+follow('ais_')}
};
const cfg=configs[type]||configs.thoracolumbar;title.textContent=cfg.title;content.innerHTML=cfg.html;
function openMODQ(key){window.open('/modq?key='+encodeURIComponent(key),'modq_'+key,'width=760,height=850,scrollbars=yes')}
async function loadP(){let c=code.value.trim();if(!c){status.textContent='کد بیمار را وارد کنید.';return}let r=await fetch('/api/patients/'+encodeURIComponent(c));if(!r.ok){status.textContent='پرونده پیدا نشد.';return}let d=await r.json();for(let e of mf.elements)if(e.name&&d[e.name]!==undefined)e.value=d[e.name];document.querySelectorAll('[id^="score_"]').forEach(e=>{let k=e.id.slice(6);e.textContent=d[k]!==undefined&&d[k]!==''?d[k]:'—'});status.textContent='✓ اطلاعات بازیابی شد.'}
async function saveP(){let c=code.value.trim();if(!c){saveStatus.textContent='کد بیمار را وارد کنید.';return}let r=await fetch('/api/patients/'+encodeURIComponent(c));if(!r.ok){saveStatus.textContent='ابتدا بیمار را در فرم اصلی ذخیره کنید.';return}let d=await r.json();for(let e of mf.elements)if(e.name)d[e.name]=e.value;d[type+'_module_completed']=true;d.patient_code=c;let w=await fetch('/api/patients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});saveStatus.textContent=w.ok?'✓ ذخیره شد.':'ذخیره انجام نشد.'}
window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='ssporm-modq')return;let box=document.getElementById('score_'+e.data.key);if(box&&e.data.score!=null)box.textContent=e.data.score});
if(code.value)loadP();
</script></body></html>
